name: FiveM Legacy Wine test build
on:
  push:
    branches: [wine-legacy-pr4095]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PY_PYTHON: '3.11'
      PY_PYTHON3: '3.11'
    steps:
      - name: Check out the test branch
        shell: bash
        run: |
          set -e
          mkdir -p /c/b/five
          cd /c/b/five
          git init
          git config core.symlinks true
          git config core.longpaths true
          git remote add origin https://github.com/serolon/fivem.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git submodule update --init --depth 1 --jobs 4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare the FiveM source
        shell: pwsh
        working-directory: C:\b\five
        run: |
          $env:NODE_GYP_FORCE_PYTHON = (Get-Command python.exe).Source
          python -m pip install setuptools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cefName = (Get-Content 'vendor/cef/cef_build_name.txt' -Encoding ascii).Trim()
          curl.exe --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 300 --create-dirs --output "code/build/$cefName.zip" "https://cfx-content.akamaized.net/mirrors/vendor/cef/v144/$cefName.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./fxd.ps1 get-chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./prebuild.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./fxd.ps1 gen -game five
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the patched FiveM projects
        shell: pwsh
        working-directory: C:\b\five
        run: |
          py -3 -c "import sys, jinja2, ply; assert sys.version_info[:2] == (3, 11); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\MSBuild.exe |
            Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild was not found.' }
          & $msbuild code/build/five/CitizenMP.sln '-t:CitiCore;CitiLaunch' -restore -p:RestorePackagesConfig=true -p:PreferredToolArchitecture=x64 -p:Configuration=Release -p:WindowsTargetPlatformVersion=10.0.22621.0 -m:4 -v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect the patched components and license notices
        shell: pwsh
        working-directory: C:\b\five
        run: |
          $bin = 'code/bin/five/release'
          New-Item -ItemType Directory -Path test-build | Out-Null
          Copy-Item "$bin/FiveM.exe", "$bin/FiveM.exe.formaldev", "$bin/CoreRT.dll", LICENSE, THIRD_PARTY_NOTICES.md, LICENSES -Destination test-build -Recurse -ErrorAction Stop
          git rev-parse HEAD | Set-Content test-build/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fivem-legacy-wine-pr4095
          path: C:/b/five/test-build/
          if-no-files-found: error
          retention-days: 7
